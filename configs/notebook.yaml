# Colab / Kaggle: one T4, AWQ weights with FP16 activations, local tools.
# Calibration defaults; validate task quality before longer comparisons.
# Generate resolved configs with
# scripts/notebook-setup.sh, then start with notebook-smoke.pinned.yaml.
extends: baseline.yaml
name: notebook
description: Development GPU testing in a Colab or Kaggle notebook

model:
  repository: Qwen/Qwen2.5-Coder-7B-Instruct-AWQ

generation:
  temperature: 0.0
  top_p: 1.0
  max_output_tokens_per_call: 1024

server:
  start_command: [vllm, serve, Qwen/Qwen2.5-Coder-7B-Instruct-AWQ, "{args}"]
  args:
    dtype: float16
    max-model-len: 8192
    max-num-seqs: 2
    max-num-batched-tokens: 8192
    tensor-parallel-size: 1
    gpu-memory-utilization: 0.85
    # Avoid graph compilation in the first session; keep fixed in comparisons.
    enforce-eager: true
  reserved_cpus: []

workload:
  edit_mode: whole_file
  max_steps: 12
  context_window_tokens: 8192
  max_observation_chars: 3000

execution:
  max_active_episodes: 2
  max_inflight_llm_requests: 2

tools:
  executor: local
  worker_cpus: []
  workers: 1

telemetry:
  live_metrics_port: null

cost:
  # Reference compute allocation, not a Colab charge. Checked 2026-10-26.
  # Iowa on-demand: one T4 ($0.35/h) + n1-standard-4 ($0.189999/h).
  allocation_hourly_rate: 0.539999
  rate_kind: estimated_equivalent
  rate_source: >-
    Google Cloud us-central1 on-demand reference: 1 NVIDIA T4 (16 GB) plus
    n1-standard-4 (4 vCPU, 15 GiB RAM); USD 0.35 + 0.189999 per hour;
    checked 2026-10-26; https://cloud.google.com/products/compute/gpus-pricing
    and https://cloud.google.com/products/compute/pricing/general-purpose?hl=en.
    Compute only; excludes disk, network, taxes, setup and idle time outside
    the measured interval. Colab performance is not a prediction of this VM.
