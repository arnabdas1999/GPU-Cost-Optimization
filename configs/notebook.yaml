# Colab / Kaggle: one T4, FP16, local tools. Generate resolved configs with
# scripts/notebook-setup.sh, then start with notebook-smoke.pinned.yaml.
extends: baseline.yaml
name: notebook
description: Development GPU testing in a Colab or Kaggle notebook

model:
  repository: Qwen/Qwen2.5-Coder-3B-Instruct

server:
  start_command: [vllm, serve, Qwen/Qwen2.5-Coder-3B-Instruct, "{args}"]
  args:
    dtype: float16
    max-model-len: 4096
    max-num-seqs: 2
    max-num-batched-tokens: 4096
    tensor-parallel-size: 1
    gpu-memory-utilization: 0.85
    # Avoid graph compilation in the first session; keep fixed in comparisons.
    enforce-eager: true
  reserved_cpus: []

workload:
  context_window_tokens: 4096
  max_observation_chars: 3000

execution:
  max_active_episodes: 2
  max_inflight_llm_requests: 2

tools:
  executor: local
  worker_cpus: []
  workers: 1

telemetry:
  live_metrics_port: null

cost:
  allocation_hourly_rate: null
  rate_source: Notebook allocation rate unknown; timings only
