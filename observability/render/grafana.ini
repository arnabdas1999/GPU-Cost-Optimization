[server]
http_addr = 0.0.0.0
enable_gzip = true

[database]
type = postgres
ssl_mode = verify-full
ca_cert_path = /etc/ssl/certs/ca-certificates.crt
max_open_conn = 5
max_idle_conn = 1
conn_max_lifetime = 300

[security]
admin_user = admin
cookie_secure = true
cookie_samesite = lax
strict_transport_security = true
strict_transport_security_max_age_seconds = 86400

[users]
allow_sign_up = false
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = true
org_role = Viewer
hide_version = true

[dashboards]
default_home_dashboard_path = /etc/rollout-cost/dashboards/history/runs-overview.json
min_refresh_interval = 1m

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[unified_alerting]
enabled = false

[plugins]
preinstall_disabled = true

[live]
max_connections = 0

[log]
mode = console
