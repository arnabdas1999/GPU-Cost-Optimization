[project]
name = "rollout-cost-lab"
version = "0.1.0"
description = "Measure the allocated-GPU cost of multi-step coding-agent episodes against a self-hosted model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    # The local tool executor runs fixture tests with the runner's interpreter.
    "pytest>=8.0",
]

[project.optional-dependencies]
# Live exporter (Prometheus) and historical export (PostgreSQL) for the Grafana dashboards.
dashboard = [
    "prometheus-client>=0.20",
    "psycopg[binary]>=3.2",
]

[project.scripts]
rollout-cost = "rollout_cost.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollout_cost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
